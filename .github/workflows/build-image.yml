name: Build image

# Builds the prebuilt Linux build image and publishes it to GHCR.
#
# The image bakes the pinned dependencies that dominate a desktop build:
# depot_tools (pinned and bootstrapped), boost, cef, icu, openssl, v8's 2929
# targets, and core/. Roughly 55 of the desktop build's 61 minutes are spent
# rebuilding exactly those, and none of them change between runs.
#
# This is deliberately NOT on the push path. It takes well over an hour and
# only needs rerunning when the upstream pin, the build flags, or the
# Dockerfile change — so it is manual, plus automatic when those inputs move.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to publish (default: the VERSION_LOCK upstream tag)"
        required: false
        default: ""
  push:
    branches: [main]
    paths:
      - docker/build-linux.Dockerfile
      - VERSION_LOCK
      - scripts/build_desktop.sh
      - scripts/fetch_prebuilts.sh
      - scripts/apply_build_flags.sh
      - scripts/patch_qt_compat.sh
      - overlay/build/**

permissions:
  contents: read
  packages: write

jobs:
  image:
    name: Build and push
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      # The image carries a full built tree, so the default runner disk is not
      # enough. This reclaims roughly 25 GB.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          df -h /

      - id: meta
        name: Resolve image tag
        run: |
          tag="${{ github.event.inputs.tag }}"
          if [ -z "$tag" ]; then
            tag="$(grep '^UPSTREAM_TAG=' VERSION_LOCK | cut -d= -f2)"
          fi
          [ -n "$tag" ] || { echo "::error::no image tag resolved"; exit 1; }
          # GHCR wants a lowercase repository path.
          repo="$(echo "ghcr.io/${{ github.repository }}-build" | tr '[:upper:]' '[:lower:]')"
          echo "ref=$repo:$tag" >> "$GITHUB_OUTPUT"
          echo "latest=$repo:latest" >> "$GITHUB_OUTPUT"
          echo "building $repo:$tag"

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      # buildx with a registry cache is the point of the layered Dockerfile:
      # without --cache-from there is nothing to reuse and every rebuild redoes
      # v8's 88 minutes, however little changed. mode=max caches intermediate
      # layers too, not just the final one.
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build
        run: |
          cache="$(echo "ghcr.io/${{ github.repository }}-build" | tr '[:upper:]' '[:lower:]'):buildcache"
          docker buildx build \
            -f docker/build-linux.Dockerfile \
            -t "${{ steps.meta.outputs.ref }}" \
            -t "${{ steps.meta.outputs.latest }}" \
            --cache-from "type=registry,ref=$cache" \
            --cache-to "type=registry,ref=$cache,mode=max" \
            --load \
            .

      # An image that built but banked nothing is worse than no image: the
      # release workflow would pull several GB and then rebuild v8 anyway. Fail
      # here instead, where the cause is visible.
      # An image that built but banked nothing is worse than no image: a release
      # run pulls several GB and then rebuilds anyway, or dies part way in.
      #
      # The first version of this checked only libv8_monolith.a and core/'s
      # libraries. Both are produced BEFORE sdkjs, and the Dockerfile tolerates
      # a build failure on purpose (it is expected to stop in desktop-apps), so
      # an image missing sdkjs passed verification, published, and cost a
      # release run 23 minutes of restore before it died on
      # "sdkjs/build/build.py: No such file or directory". Any MISSING line in
      # the manifest now fails the publish.
      - name: Verify the image actually banked what a build needs
        run: |
          manifest=$(docker run --rm "${{ steps.meta.outputs.ref }}" cat /etc/lightoffice-build-image)
          echo "$manifest"
          # The Dockerfile keeps the build log inside the image because GitHub
          # truncates the BuildKit output for a layer that long. Surface it here,
          # where the output actually survives, whenever the build did not
          # complete — otherwise the reason stays invisible for another 90 min.
          case "$manifest" in
            *"build_desktop: FAILED"*)
              echo "----- last 200 lines of the in-image build log -----"
              docker run --rm "${{ steps.meta.outputs.ref }}" \
                sh -c 'cat /var/log/lightoffice/build.tail.log 2>/dev/null || echo "(no build log captured)"'
              echo "----- end of build log -----" ;;
          esac

          fail=0
          case "$manifest" in
            *libv8_monolith.a*) echo "v8 present" ;;
            *) echo "::error::image has no libv8_monolith.a — the v8 build did not complete"; fail=1 ;;
          esac
          case "$manifest" in
            *kernel*) echo "core libraries present" ;;
            *) echo "::error::image has no core/ libraries — the build stopped before core"; fail=1 ;;
          esac
          if missing=$(printf '%s\n' "$manifest" | grep '^MISSING '); then
            echo "::error::image is missing paths a build needs:"
            printf '%s\n' "$missing"
            fail=1
          fi
          [ "$fail" -eq 0 ] || exit 1

      - name: Push
        run: |
          docker push "${{ steps.meta.outputs.ref }}"
          docker push "${{ steps.meta.outputs.latest }}"
          {
            echo "### Image published"
            echo
            echo '```'
            echo "${{ steps.meta.outputs.ref }}"
            echo '```'
            bytes=$(docker image inspect "${{ steps.meta.outputs.ref }}" --format '{{.Size}}')
            echo "size: $(( bytes / 1048576 )) MiB"
          } >> "$GITHUB_STEP_SUMMARY"
