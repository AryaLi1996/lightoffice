name: Build Artifacts

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# The Linux job takes about 50 minutes. Merging three PRs in quick succession
# starts three of them, all building the same tree, and only the newest commit
# is the one anyone wants built — the rest burn a runner for an answer that is
# already stale before it arrives. On the night of 2026-09-10 four superseded
# runs had to be cancelled by hand (34380149207, 34420970170, 34421078528,
# 34432524996, 34434158377); doing that reliably depends on someone watching.
#
# cancel-in-progress rather than queueing: a queued duplicate still costs the
# full 50 minutes, it just costs them later, and it delays the run that matters
# behind one whose result is already superseded.
concurrency:
  group: build-artifacts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-linux:
    name: Build Linux
    # MUST match the image's base (FROM ubuntu:24.04). The image's prebuilt
    # shared libraries are compiled against its glibc, and linking them on an
    # older runner fails on symbols that do not exist there. On ubuntu-22.04
    # (glibc 2.35) run 34380149207 died linking x2t after 21m41s:
    #
    #   ld: libdoctrenderer.so: undefined reference to `__isoc23_strtoll'
    #   ld: libicuuc.so.74: undefined reference to `__isoc23_strtol@GLIBC_2.38'
    #   ld: libicuuc.so.74: undefined reference to `arc4random@GLIBC_2.36'
    #
    # __isoc23_* are @@GLIBC_2.38 and arc4random is @GLIBC_2.36; 22.04 has
    # neither. release.yml runs on ubuntu-latest (24.04), which is why its build
    # reached the deploy stage while this one could not link core/.
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Restore apt cache
        uses: actions/cache@v4
        id: apt-cache
        with:
          path: /var/cache/apt/archives
          key: apt-cache-linux-${{ hashFiles('.github/workflows/build.yml') }}
          restore-keys: |
            apt-cache-linux-

      # There is deliberately no actions/cache for /opt/lightoffice/src. That
      # tree is ~24 GB and the Actions cache caps a single entry at 10 GB, so the
      # save silently never happens -- and a restore-keys partial hit would then
      # skip the image restore below and hand the build a broken tree.
      # The prebuilt image in GHCR is the cache, and it has no size limit.

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            build-essential cmake p7zip-full autoconf libtool \
            qtbase5-dev qtbase5-private-dev qttools5-dev libqt5svg5-dev \
            qtmultimedia5-dev libqt5x11extras5-dev \
            libgtk-3-dev libglu1-mesa-dev libx11-xcb-dev libxi-dev \
            libxrender-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libnotify-dev libcups2-dev libdbus-1-dev libicu-dev \
            libasound2-dev libatspi2.0-dev dpkg-dev patchelf binutils gifsicle \
            imagemagick

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true
          df -h / | tail -1

      # This job CONSUMES the image that build-image.yml publishes; it must not
      # rebuild it. Building the image here wrote a ~24 GB tarball to /tmp and
      # then `docker load`ed it, which is the same disk exhaustion that killed
      # run 34363351869.
      #
      # The restore that was here could never work: it mounted the empty host
      # /opt/lightoffice OVER the image's own /opt/lightoffice, hiding the built
      # tree behind the mount. It printed "src missing in image" every time and
      # copied nothing, so bootstrap.sh below cloned from scratch and every run
      # was a full cold build. `docker cp` reads the image's filesystem instead,
      # which is what release.yml does and what has been measured (17m42s).
      #
      # ninja and make key off absolute paths and mtimes, so the tree is restored
      # to the SAME path the image built it at. Restoring elsewhere rebuilds
      # everything and buys nothing.
      - id: prebuilt
        name: Restore the prebuilt tree from the published image
        shell: bash
        run: |
          repo="$(echo "ghcr.io/${{ github.repository }}-build" | tr '[:upper:]' '[:lower:]')"
          tag="$(grep '^UPSTREAM_TAG=' VERSION_LOCK | cut -d= -f2)"
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin || true
          if ! docker pull "$repo:$tag"; then
            echo "::notice::no prebuilt image at $repo:$tag -- building everything from source"
            echo "hit=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          docker run --rm "$repo:$tag" cat /etc/lightoffice-build-image \
            > /tmp/image-manifest.txt 2>/dev/null || true
          cat /tmp/image-manifest.txt || true

          echo "disk before copy:"; df -h / | tail -1
          sudo mkdir -p /opt/lightoffice
          cid="$(docker create "$repo:$tag")"
          sudo docker cp "$cid:/opt/lightoffice/src" /opt/lightoffice/src
          docker rm "$cid" >/dev/null
          echo "disk after copy:"; df -h / | tail -1
          sudo chown -R "$(id -u):$(id -g)" /opt/lightoffice
          docker rmi "$repo:$tag" >/dev/null 2>&1 || true
          echo "restored $(du -sh /opt/lightoffice/src | cut -f1) to /opt/lightoffice/src"

          # A tree that looks fine but lacks a path the build needs costs the
          # whole build step before it says so. Discard it and let bootstrap.sh
          # clone cleanly instead: slower than a good image, far faster than
          # failing an hour in.
          incomplete=""
          for p in sdkjs/build/build.py web-apps/build/Gruntfile.js core/Common \
                   desktop-sdk desktop-apps/win-linux build_tools .git \
                   core-fonts/ASC.ttf document-templates/new; do
            [ -e "/opt/lightoffice/src/$p" ] || incomplete="$incomplete $p"
          done
          if [ -n "$incomplete" ]; then
            echo "::warning::prebuilt tree is incomplete (missing:$incomplete) -- discarding it and building from source"
            sudo rm -rf /opt/lightoffice/src
            echo "hit=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # The check that turns the 21m41s link failure into a two-second one.
          # The manifest records the image's base (base=ubuntu:24.04); if this
          # runner is a different release its glibc differs and the prebuilt .so
          # files will not link. Read it from the manifest captured above, not by
          # running the image again -- docker rmi has already dropped it.
          base="$(sed -n 's/^base=//p' /tmp/image-manifest.txt | head -1)"
          runner="$(. /etc/os-release; echo "$ID:$VERSION_ID")"
          if [ -z "$base" ]; then
            echo "::warning::image manifest records no base -- cannot check it against this runner"
          elif [ "$base" != "$runner" ]; then
            echo "::error::this runner is $runner but the prebuilt image was built on $base"
            echo "::error::the image's shared libraries link against its glibc, so they will not link here"
            echo "::error::run this job on a runner matching $base"
            exit 1
          else
            echo "runner $runner matches the image base"
          fi

          echo "prebuilt tree has every path the build needs"
          echo "hit=true" >> "$GITHUB_OUTPUT"

      - name: Bootstrap, overlay and patch
        shell: bash
        env:
          LIGHTOFFICE_SRC: /opt/lightoffice/src
        run: |
          scripts/bootstrap.sh "$LIGHTOFFICE_SRC"
          scripts/fetch_prebuilts.sh || echo "::warning::prebuilt fetch incomplete; the build may not start"
          scripts/apply_overlay.sh "$LIGHTOFFICE_SRC"
          scripts/apply_build_flags.sh "$LIGHTOFFICE_SRC"
          # Must run after apply_build_flags.sh, which appends to the same
          # defaults.pri, and before any link.
          scripts/patch_static_libstdcxx.sh "$LIGHTOFFICE_SRC"
          scripts/patch_qt_compat.sh "$LIGHTOFFICE_SRC"
          scripts/patch_v8_incremental.sh "$LIGHTOFFICE_SRC"
          scripts/trim_dictionaries.sh "$LIGHTOFFICE_SRC"

      # ~1 minute, and it reports EVERY Qt incompatibility at once instead of
      # letting make stop at the first one an hour into the build.
      - name: Check desktop-apps compiles against this Qt
        shell: bash
        env:
          LIGHTOFFICE_SRC: /opt/lightoffice/src
        run: scripts/check_qt_compat.sh

      # No CC/CXX/LDFLAGS here. ONLYOFFICE builds with qmake, and qmake writes
      # CC, CXX and LINK into the generated Makefile from the mkspec; make gives
      # Makefile assignments precedence over the environment, so `CC="ccache gcc"`
      # and `LDFLAGS=-fuse-ld=mold` are silently ignored:
      #
      #     $ printf 'CC = gcc\\nall:\\n\\t@echo $(CC)\\n' > Makefile
      #     $ CC=clang make all
      #     gcc
      #
      # Wiring either one in for real means QMAKE_CXX / QMAKE_LFLAGS in
      # overlay/build/lightoffice_size_opt.pri. That is worth doing, but only
      # against a measured baseline and not in the same run that is trying to
      # produce a first installer -- build_desktop.sh now prints phase timings,
      # so the next run says where the time actually goes.
      - name: Build desktop editors
        shell: bash
        env:
          LIGHTOFFICE_SRC: /opt/lightoffice/src
        run: scripts/build_desktop.sh

      # The version must start with a digit or dpkg-deb refuses to build:
      #
      #     dpkg-deb: error: ... 'Version' field value 'ba431d9':
      #       version number does not start with digit
      #
      # A bare ${GITHUB_SHA::7} fails whenever the short sha begins with a
      # letter, which is most of the time. Keep the sha for traceability, but
      # behind a version that dpkg accepts.
      - name: Package installers
        shell: bash
        env:
          LIGHTOFFICE_SRC: /opt/lightoffice/src
        run: |
          # No --compress-type gzip --compress-level 1 any more. That was chosen
          # to make CI packaging fast, and it is the worst possible setting for
          # the thing that now matters: AC V.3 caps the installer at 120MB and
          # the gzip -1 .deb came out at 1052 MiB. package.sh defaults to xz,
          # which costs packaging minutes and buys back a large fraction of the
          # size for free. Time it, so the trade is a measured number rather than
          # an assumption.
          t0=$SECONDS
          scripts/package.sh --version "1.0.0+git${GITHUB_SHA::7}"
          echo "packaging took $((SECONDS - t0))s"

      - name: Verify the build produced an installer
        shell: bash
        run: |
          shopt -s nullglob
          found=(artifacts/WPS-Lite-*)
          if [ ${#found[@]} -eq 0 ]; then
            echo "::error::the build and packaging steps succeeded but produced no installer in artifacts/"
            exit 1
          fi
          for f in "${found[@]}"; do
            printf 'produced: %s (%s MiB)\n' "$f" "$(( $(stat -c%s "$f") / 1048576 ))"
          done

      # AC V.4 wants a delivery archive and a manifest carrying the Git commit
      # ID and the upstream pin. scripts/archive.sh has existed since the start
      # and had simply never been wired into CI, so V.4 failed on every run for
      # want of a caller. It must run AFTER packaging: the manifest enumerates
      # the installers it finds in artifacts/, so running it first would produce
      # a manifest with an empty "installers" list.
      - name: Produce the delivery archive
        shell: bash
        run: |
          scripts/archive.sh --version "1.0.0+git${GITHUB_SHA::7}"

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-artifacts
          path: artifacts/
          retention-days: 30

      # AC V.5 has reported BLOCKED with a stale note ("no built application;
      # v8 sources unreachable") since 2026-09-07, because baseline/ime.json is
      # a checked-in file that nothing in CI ever refreshed. Both halves of that
      # note are now false: the application builds and runs. Run the real check
      # so V.5 reports what is actually true.
      #
      # This must come BEFORE the acceptance-criteria step, which only reads the
      # JSON this produces.
      #
      # ime_test.sh reports the two levels separately and never lets the weaker
      # stand in for the stronger, so an IME that fails to come up here degrades
      # V.5 to ADJUSTED rather than faking a pass. Hence `|| true`: an honest
      # BLOCKED is a result, not a build failure.
      - name: Chinese input check under a headless X server
        continue-on-error: true
        env:
          LIGHTOFFICE_SRC: /opt/lightoffice/src
        run: |
          sudo apt-get install -y -qq --no-install-recommends \
            xvfb xdotool xclip ibus ibus-libpinyin dbus-x11 || true

          Xvfb :99 -screen 0 1280x1024x24 >/tmp/xvfb.log 2>&1 &
          export DISPLAY=:99
          for _ in $(seq 1 20); do
            xdotool getdisplaygeometry >/dev/null 2>&1 && break
            sleep 1
          done

          # Best effort. ibus needs a session bus and a configured engine; if
          # either is missing the script says so instead of guessing.
          eval "$(dbus-launch --sh-syntax)" || true
          ibus-daemon -drx >/tmp/ibus.log 2>&1 || true
          sleep 5
          ibus engine libpinyin >/dev/null 2>&1 || ibus engine pinyin >/dev/null 2>&1 || true
          echo "ibus engine: $(ibus engine 2>&1 || echo unavailable)"

          scripts/ime_test.sh --display :99 || true
          echo "--- baseline/ime.json ---"
          cat baseline/ime.json || true

      # scripts/verify_ac.sh has never once run against a real artifact. Eleven
      # of its criteria have only ever reported BLOCKED, not because they fail
      # but because there was nothing to measure -- no binary, no installer.
      # Run 34421271035 produced both, so they can finally be evaluated.
      #
      # It runs HERE and not anywhere else because this is the only place all
      # three inputs coexist: the packaged .deb in artifacts/, the built tree at
      # /opt/lightoffice/src that find_binary() searches, and an OS matching the
      # one the binary was linked against. Pulling the artifact down to a dev
      # container is not an option -- the egress policy denies the Actions
      # artifact blob host (403 on CONNECT to *.blob.core.windows.net).
      #
      # After the upload, and continue-on-error, on purpose. The artifact is
      # already safely stored by this point, and a genuine FAIL here is a
      # finding to read rather than a reason to redden a build that produced a
      # valid installer. Installer size is the likely one: the .deb is 1052 MiB
      # against a criterion that expects far less.
      - name: Acceptance criteria against the real artifact
        continue-on-error: true
        shell: bash
        env:
          LIGHTOFFICE_SRC: /opt/lightoffice/src
        run: |
          set +e
          # Bounded: several criteria probe the network (Nextcloud, Document
          # Server) and others walk a 29 GB tree. Locally this took over two
          # minutes; a pathological case must not sit on the job.
          timeout 900 scripts/verify_ac.sh --json baseline/ac_report.json 2>&1 | tee /tmp/ac.log
          rc=${PIPESTATUS[0]}
          [ "$rc" -eq 124 ] && echo "::warning::verify_ac.sh hit the 900s timeout"
          echo "verify_ac.sh exit: $rc"
          {
            echo "### Acceptance criteria (first run against a real artifact)"
            echo
            echo '```'
            # The summary line plus every row that is not a plain PASS: those
            # are the ones worth a human's attention.
            grep -E 'FAIL|BLOCKED|ADJUSTED|SKIPPED|汇总' /tmp/ac.log || cat /tmp/ac.log
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
          exit 0

      # These two run LAST, after the artifact upload, and that placement is
      # deliberate. They used to sit right after packaging, which put roughly
      # 110 lines of the 786 MiB upload's "Uploaded bytes" between their output
      # and the end of the job log — far enough back that reading the log tail
      # could not reach them, so run #15 produced both and neither could be
      # read. Diagnostics belong where they can actually be recovered.
      #
      # Nothing downstream consumes them, so ordering costs nothing: both are
      # read-only and continue-on-error.
      # Run #14 proved the shim works and, in doing so, showed the problem is a
      # CLASS of symbols rather than one: the loader moved past both symbols the
      # shim supplies and stopped at std::locale::_S_classic. Locally the class
      # is 11 symbols, four of them functions — so it cannot be shimmed, and the
      # root cause has to be found instead. This step exists to find it.
      - name: Trace the dangling libstdc++ statics
        continue-on-error: true
        shell: bash
        env:
          LIGHTOFFICE_SRC: /opt/lightoffice/src
        run: |
          set +e
          dir="$LIGHTOFFICE_SRC/build_tools/out/linux_64/onlyoffice/desktopeditors"
          host=/usr/lib/x86_64-linux-gnu/libstdc++.so.6
          arch=$(gcc -print-file-name=libstdc++.a)
          # nm -D prints "symbol@@GLIBCXX_3.4"; comparing those raw against the
          # archive's unversioned names reports ~10x more missing symbols than
          # actually are. Strip the version before every comparison here.
          nm -D --defined-only "$host" 2>/dev/null | awk '{print $3}' | sed 's/@.*//' \
            | sort -u > /tmp/so-exports.txt
          {
            echo "### Dangling libstdc++ statics"
            echo
            echo "host libstdc++: $(readlink -f "$host")"
            echo "static archive: $arch"
            echo
            echo '#### Ground truth: symbols the deployed tree needs and no library provides'
            echo '```'
            find "$dir" -type f 2>/dev/null | while read -r f; do
              head -c 4 "$f" 2>/dev/null | grep -q ELF || continue
              nm -D --undefined-only "$f" 2>/dev/null | awk '{print $2}' | sed 's/@.*//'
            done | sort -u | grep -E '^_ZNS' > /tmp/tree-undef.txt
            comm -23 /tmp/tree-undef.txt /tmp/so-exports.txt > /tmp/tree-missing.txt
            # A symbol missing from libstdc++.so but present in libstdc++.a is
            # the signature of this bug: a static-archive object was linked in
            # without the object holding its definitions.
            nm -A --defined-only "$arch" 2>/dev/null | awk '{print $3}' | sort -u \
              > /tmp/a-defines.txt
            comm -12 /tmp/tree-missing.txt /tmp/a-defines.txt | tee /tmp/trap.txt | c++filt
            echo
            echo "trap symbols: $(wc -l < /tmp/trap.txt)"
            echo "other unresolved (not from libstdc++): $(comm -23 /tmp/tree-missing.txt /tmp/a-defines.txt | wc -l)"
            echo '```'
            echo
            echo '#### Which archive object each one lives in'
            echo '```'
            while read -r sym; do
              printf '%-56s defined in: %s\n' "$(echo "$sym" | cut -c1-56)" \
                "$(nm -A --defined-only "$arch" 2>/dev/null | grep -w "$sym" \
                   | head -1 | sed 's/.*\.a://; s/:.*//')"
            done < /tmp/trap.txt
            echo '```'
            echo
            echo '#### THE ROOT CAUSE: who pulls those objects in'
            echo '```'
            # If a static libstdc++ object is inside one of the build tree'"'"'s own
            # archives, that archive is the culprit and naming it is the fix.
            find "$LIGHTOFFICE_SRC" -name '*.a' -size +1k 2>/dev/null | while read -r a; do
              m=$(ar t "$a" 2>/dev/null | grep -xE 'ios_init\.o|locale_init\.o|localename\.o|globals_io\.o|locale\.o|ios\.o' | tr '\n' ' ')
              [ -n "$m" ] && printf '%s\n    contains: %s\n' "${a#"$LIGHTOFFICE_SRC"/}" "$m"
            done | head -40
            echo "--- link flags that would cause this ---"
            # --include must precede `--`: after `--`, grep treats each one as a
            # FILE operand and searches everything. Run 34449852586 reported
            # clang++ and libclang.so here for exactly that reason.
            grep -rln --include='*.pro' --include='*.pri' --include='*.gn' \
              --include='*.gni' --include='Makefile' --include='*.conf' \
              -- '-static-libstdc++' "$LIGHTOFFICE_SRC" 2>/dev/null | head -20
            echo '(end)'
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
          exit 0

      # The profile goes LAST, after the trace. Both steps are large inline
      # run blocks, and the runner echoes every line of a run block into the
      # log before executing it — so the one that runs first has ~60 lines of
      # the second one's source between its output and the end of the log.
      # Run 34449852586 hit exactly that: the trace was readable, the profile
      # was not. The trace has now done its job (it named the GCC 7 sysroot
      # archive), so the profile is the diagnostic that has to stay reachable.
      # A build that ran and then produced nothing is a green check that means
      # nothing. package.sh exits 0 when there is no build output, so without
      # this the job would go green having packaged air -- which is exactly how
      # the wrong binary path stayed invisible for as long as it did.
      # AC V.3 caps the installer at 120MB; the first one built came out at
      # 1052 MiB. Before cutting anything, find out what is actually in there.
      # package.sh stages `cp -a` of upstream's whole deploy directory, so the
      # payload is exactly that tree and nothing is excluded today.
      #
      # This is read-only and takes seconds. Guessing at CEF vs Qt vs fonts and
      # cutting the wrong one costs a 50-minute cycle to find out.
      - name: Profile the installer payload
        continue-on-error: true
        shell: bash
        env:
          LIGHTOFFICE_SRC: /opt/lightoffice/src
        run: |
          set +e
          dir="$LIGHTOFFICE_SRC/build_tools/out/linux_64/onlyoffice/desktopeditors"
          [ -d "$dir" ] || { echo "::warning::no deploy dir at $dir"; exit 0; }
          {
            echo "### Installer payload profile"
            echo
            echo "Uncompressed deploy tree: **$(du -sh "$dir" | cut -f1)**"
            deb=$(find artifacts -maxdepth 1 -name 'WPS-Lite-*.deb' | head -1)
            if [ -n "$deb" ]; then
              echo "Packaged .deb: **$(du -h "$deb" | cut -f1)** (AC V.3 limit: ${LIGHTOFFICE_MAX_INSTALLER_MB:-650}MB)"
            fi
            echo
            echo '#### Top 25 directories'
            echo '```'
            du -h --max-depth=2 "$dir" 2>/dev/null | sort -hr | head -25 \
              | sed "s#$dir#.#"
            echo '```'
            echo
            echo '#### Top 25 individual files'
            echo '```'
            find "$dir" -type f -printf '%s\t%p\n' 2>/dev/null | sort -rn | head -25 \
              | awk -v d="$dir" '{ sub(d,".",$2); printf "%8.1f MiB  %s\n", $1/1048576, $2 }'
            echo '```'
            echo
            echo '#### By file type'
            echo '```'
            find "$dir" -type f -printf '%s\t%f\n' 2>/dev/null \
              | awk -F'\t' '{ n=$2; ext=(n ~ /\./) ? tolower(substr(n, match(n,/\.[^.]*$/))) : "(none)";
                               sz[ext]+=$1; cnt[ext]++ }
                             END { for (e in sz) printf "%10.1f MiB  %6d  %s\n", sz[e]/1048576, cnt[e], e }' \
              | sort -rn | head -20
            echo '```'
            echo
            echo '#### Debug info still in the payload'
            echo '```'
            find "$dir" -type f \( -name '*.so' -o -name '*.so.*' -o -perm -u+x \) \
              -printf '%s\t%p\n' 2>/dev/null \
              | while IFS=$'\t' read -r sz f; do
                  head -c 4 "$f" 2>/dev/null | grep -q ELF || continue
                  file "$f" 2>/dev/null | grep -q 'not stripped' && echo "$sz	$f"
                done \
              | sort -rn \
              | awk -v d="$dir" '{ t+=$1; n++; if (n<=10) { p=$2; sub(d,".",p);
                    printf "%8.1f MiB  %s\n", $1/1048576, p } }
                  END { printf "\n%d unstripped file(s), %.1f MiB of debug info\n",
                        n, t/1048576 }'
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
          exit 0

      # The repair in scripts/fix_stdcxx_statics.sh makes the tree launchable,
      # but it is a repair: something in the upstream link pulls libstdc++'s
      # ios_init.o out of a static archive while leaving ios.o behind. This
      # reports which archive that is, so the root fix can replace the repair.
      - name: Upload the acceptance-criteria report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ac-report
          path: |
            baseline/ac_report.json
          retention-days: 30
          if-no-files-found: warn

  build-windows:
    name: Build Windows
    runs-on: windows-2022
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # Was a vcpkg cache. Nothing in this repository or in upstream's Windows
      # build uses vcpkg -- there is no vcpkg.json, so hashFiles returned empty
      # and the key never varied. It cached an empty directory and implied a
      # dependency that does not exist. Cache Qt instead, which this build
      # really does download (~1.5 GB via aqtinstall) on every run.
      - name: Cache Qt
        uses: actions/cache@v4
        with:
          path: C:\Qt
          key: qt-5.15.2-msvc2019_64-${{ runner.os }}

      # STEP ONE OF THE WINDOWS PORT: report what only a real Windows runner
      # can tell us, before committing to a build that takes hours.
      #
      # The rest was settled by reading the pinned trees directly:
      #   - desktop-apps has NO make_installer.bat anywhere. scripts/package.sh
      #     invoked one for months; the real packaging is PowerShell in
      #     desktop-apps/package (make.ps1 then make_inno.ps1).
      #   - those scripts take -Sign as an opt-in switch defaulting OFF, so an
      #     unsigned build needs no certificate, matching the fleet-only
      #     posture already settled for macOS.
      #   - build_tools' boost.py knows msvc-14.0 (VS 2015) and msvc-14.2
      #     (VS 2019) and nothing newer.
      #
      # So the one open question is the toolchain: which MSVC toolsets this
      # image actually carries, and whether Qt and Inno Setup are present. On
      # macOS the equivalent assumption went unchecked and cost 18 minutes and
      # a confusing link error, so it gets checked first here.
      - name: Discover what a Windows build needs
        continue-on-error: true
        shell: bash
        run: |
          set +e
          {
            echo "### Windows build: runner capabilities"
            echo
            echo '```'
            echo "os          : $(cmd //c ver 2>/dev/null | tr -d '\r' | tr -s ' ')"
            echo "python3     : $(python3 --version 2>&1)"
            echo "powershell  : $(powershell -NoProfile -Command '$PSVersionTable.PSVersion.ToString()' 2>/dev/null | tr -d '\r')"
            vswhere="/c/Program Files (x86)/Microsoft Visual Studio/Installer/vswhere.exe"
            if [ -x "$vswhere" ]; then
              vs="$("$vswhere" -latest -property installationPath 2>/dev/null | tr -d '\r')"
              echo "VS          : $("$vswhere" -latest -property displayName 2>/dev/null | tr -d '\r')"
              echo "VS path     : $vs"
              echo "MSVC sets   : $(ls "$vs/VC/Tools/MSVC" 2>/dev/null | tr '\n' ' ')"
            else
              echo "VS          : vswhere MISSING"
            fi
            echo "qmake       : $(command -v qmake qmake.exe 2>/dev/null | head -1 || echo 'not installed')"
            echo "Qt env      : ${Qt5_DIR:-${QT_ROOT_DIR:-unset}}"
            for c in "/c/Program Files (x86)/Inno Setup 6" "/c/Program Files/Inno Setup 6"; do
              [ -x "$c/ISCC.exe" ] && echo "Inno Setup  : $c" && inno=1
            done
            [ -z "${inno:-}" ] && echo "Inno Setup  : not installed"
            echo "cmake       : $(cmake --version 2>/dev/null | head -1)"
            echo '```'
            echo
            echo "boost.py at this pin selects msvc-14.0 (vc140, VS 2015) by default and"
            echo "msvc-14.2 (vc142, VS 2019) only when --vs-version 2019 is passed. It has"
            echo "no branch for VS 2022 (vc143). If the MSVC set above has no 14.2x entry,"
            echo "that gap is the first thing the build will hit."
          } | tee -a "$GITHUB_STEP_SUMMARY"
          exit 0

      # Qt for MSVC is not on the image. aqtinstall is the standard way to get
      # an official Qt in CI -- the analogue of `brew install qt@5` on macOS.
      # Qt 5.15.2 msvc2019_64 matches the toolset boost.py's newest branch asks
      # for. Inno Setup 6 is what make_inno.ps1 wants; it reads $INNOPATH
      # before falling back to a registry key, so the build script sets that
      # rather than hoping the key is where upstream expects.
      - name: Install Windows build dependencies
        id: deps
        continue-on-error: true
        shell: bash
        run: |
          pip install --quiet aqtinstall || true
          python -m aqt install-qt windows desktop 5.15.2 win64_msvc2019_64 \
            -O /c/Qt >/tmp/aqt.log 2>&1 || tail -20 /tmp/aqt.log
          qt=/c/Qt/5.15.2/msvc2019_64
          choco install innosetup --no-progress -y >/tmp/inno.log 2>&1 || tail -20 /tmp/inno.log
          echo "qt: $qt $([ -x "$qt/bin/qmake.exe" ] && echo present || echo MISSING)"
          if [ -x "$qt/bin/qmake.exe" ]; then
            echo "LIGHTOFFICE_QT_PREFIX=$qt" >> "$GITHUB_ENV"
            echo "qt=ok" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::windows: aqtinstall did not provide Qt 5.15.2 msvc2019_64"
            echo "qt=missing" >> "$GITHUB_OUTPUT"
          fi

          # grunt drives the JS stage. Upstream installs it in
          # build_tools/tools/linux/deps.py, which only runs on Linux; see the
          # same block in the macOS deps step and the long note in
          # docker/build-linux.Dockerfile. Windows has not reached the JS stage
          # yet (it is still dying earlier, in V8), but it would hit exactly the
          # wall macOS hit in run 34669576598, so install it now rather than
          # spend another 30-minute run finding that out.
          npm install -g grunt-cli >/dev/null 2>&1 || npm install -g grunt-cli
          if command -v grunt >/dev/null 2>&1; then
            echo "grunt: $(command -v grunt)"
          else
            echo "::warning::windows: grunt-cli did not install"
          fi

      # THE COMPILER IS NOT ON PATH UNTIL vcvarsall RUNS. Run 34666010157 hit
      # this 4m46s in, after cloning all of Boost:
      #
      #   Building Boost.Build engine
      #   'cl' is not recognized as an internal or external command
      #   Failed to build Boost.Build engine.
      #   Error (bootstrap.bat): 1
      #
      # Not the vc143 gap that was expected -- simpler and more basic. MSVC
      # only reaches PATH after vcvarsall.bat, which is what a "Developer
      # Command Prompt" does for you and what a plain bash step does not. The
      # preflight checked that Visual Studio was INSTALLED, which was true and
      # not the question; it never checked that the compiler was CALLABLE.
      #
      # -vcvars_ver=14.2 selects the v142 toolset when it is present, because
      # that is the newest boost.py has a branch for. Falling back to the
      # default when it is absent is deliberate: it gets the build moving and
      # the next failure then tells us whether vc143 really is a problem,
      # rather than stopping here on a prediction.
      #
      # Only PATH/INCLUDE/LIB/LIBPATH are exported. Dumping all of `set` into
      # GITHUB_ENV drags in multi-line and quoted values that corrupt the file.
      - name: Set up the MSVC environment
        if: steps.deps.outputs.qt == 'ok'
        shell: bash
        run: |
          vswhere="/c/Program Files (x86)/Microsoft Visual Studio/Installer/vswhere.exe"
          vs="$("$vswhere" -latest -property installationPath | tr -d '\r')"
          vcvars="$vs\\VC\\Auxiliary\\Build\\vcvarsall.bat"
          echo "vcvarsall: $vcvars"

          ver_arg=""
          if ls "$vs/VC/Tools/MSVC" 2>/dev/null | grep -q '^14\.2'; then
            ver_arg="-vcvars_ver=14.2"
            echo "v142 toolset present — selecting it ($ver_arg)"
          else
            echo "::warning::windows: no v142 toolset; using the default."
            echo "  boost.py has no branch newer than msvc-14.2, so this may be"
            echo "  the next blocker. Letting it proceed to find out."
          fi

          # Via a batch file rather than `cmd //c "call \"$vcvars\" ..."`.
          # That form died with
          #   '\"C:\Program Files\...\vcvarsall.bat\"' is not recognized
          # because the backslash-escaped quotes bash hands to cmd survive as
          # literal characters in the command token, so cmd looks for a program
          # whose name begins with a quote. A batch file has no nested quoting
          # to get wrong, and its own "..." around the path is plain cmd syntax.
          # Kept in RUNNER_TEMP (D:\a\_temp) and invoked by bare filename from
          # that directory, so no path with a space ever reaches a command line.
          bat="$RUNNER_TEMP/lightoffice_vcenv.bat"
          {
            echo "@echo off"
            echo "call \"$vcvars\" x64 $ver_arg >nul || exit /b 1"
            echo "set"
          } > "$bat"

          if ! ( cd "$RUNNER_TEMP" && cmd //c lightoffice_vcenv.bat ) \
                 | tr -d '\r' > /tmp/vcenv.txt; then
            echo "::error::windows: vcvarsall.bat failed"
            sed 's/^/  /' "$bat"
            head -20 /tmp/vcenv.txt | sed 's/^/  /'
            exit 1
          fi

          # An empty or PATH-less dump means vcvarsall ran but set nothing, which
          # would otherwise surface 5 minutes later as 'cl' is not recognized.
          if ! grep -qi '^PATH=' /tmp/vcenv.txt; then
            echo "::error::windows: vcvarsall.bat produced no PATH — nothing to export"
            head -20 /tmp/vcenv.txt | sed 's/^/  /'
            exit 1
          fi

          for var in PATH INCLUDE LIB LIBPATH; do
            line="$(grep -i "^$var=" /tmp/vcenv.txt | head -1 || true)"
            if [ -n "$line" ]; then
              echo "$line" >> "$GITHUB_ENV"
              echo "exported $var (${#line} chars)"
            else
              echo "::warning::windows: vcvarsall set no $var"
            fi
          done

          # Prove cl.exe is actually on the PATH we just exported, rather than
          # trusting that vcvarsall did its job. Not with `command -v`: the
          # dumped PATH is a Windows one (C:\... entries, ';' separators) and
          # bash cannot search it. Walk it instead, converting each entry.
          # GITHUB_ENV only applies to later steps, so this has to read the dump.
          found=""
          while IFS= read -r dir; do
            [ -n "$dir" ] || continue
            # cygpath is the conversion Git bash ships for exactly this; the
            # sed is the fallback, and lowercases the drive letter because
            # vswhere reports "C:" while the MSYS mount is /c.
            if command -v cygpath >/dev/null 2>&1; then
              p="$(cygpath -u "$dir" 2>/dev/null || true)"
            else
              p="$(printf '%s' "$dir" | sed 's|\\|/|g; s|^\([A-Za-z]\):|/\1|' \
                    | sed 's|^/\(.\)|/\L\1|')"
            fi
            [ -n "$p" ] || continue
            if [ -x "$p/cl.exe" ]; then found="$dir"; break; fi
          done <<< "$(grep -i '^PATH=' /tmp/vcenv.txt | head -1 | cut -d= -f2- | tr ';' '\n')"

          if [ -n "$found" ]; then
            echo "cl.exe found on the exported PATH: $found"
          else
            echo "::warning::windows: no cl.exe on the exported PATH —"
            echo "  the preflight will say so before the build burns time on it"
          fi

          # V8 8.9 (core/Common/3dParty/v8_89) carries a 2021-era Chromium
          # build/vs_toolchain.py whose GetVisualStudioVersion() knows only
          # 2017 and 2019. On this runner it raises, 30 minutes in:
          #
          #   Exception: No supported Visual Studio can be found.
          #     Supported versions are: 16.0 (2019), 15.0 (2017).
          #   ERROR at //build/config/win/visual_studio_version.gni:27:7
          #   Error (gn): 1
          #
          # That script's own escape hatch is the vs<year>_install variable: it
          # probes $vs2019_install before the hardcoded install paths, and
          # DetectVisualStudioPath() then returns whatever that names. Pointing
          # it at the 2022 installation makes the 2019 branch resolve to a real
          # toolchain. This is not pretending 2022 is 2019 for the compile --
          # vcvarsall above already selected the v142 toolset, which is what
          # both V8 and boost.py expect; it only tells a script that predates
          # 2022 where that toolset lives.
          #
          # DEPOT_TOOLS_WIN_TOOLCHAIN=0 is what puts it on this path at all:
          # with it unset the script assumes Google's internal toolchain
          # package. It is already 0 here, which is why the exception surfaced
          # rather than a missing-package error; set it explicitly so the
          # behaviour does not depend on what set it.
          if [ -n "${vs:-}" ]; then
            {
              echo "vs2019_install=$vs"
              echo "GYP_MSVS_VERSION=2019"
              echo "GYP_MSVS_OVERRIDE_PATH=$vs"
              echo "DEPOT_TOOLS_WIN_TOOLCHAIN=0"
            } >> "$GITHUB_ENV"
            echo "V8: pointed vs2019_install at $vs"
          else
            echo "::warning::windows: no VS installation path — V8 will not configure"
          fi

      - name: Bootstrap the upstream tree
        if: steps.deps.outputs.qt == 'ok'
        shell: bash
        env:
          LIGHTOFFICE_SRC: /c/lightoffice/src
        run: |
          mkdir -p /c/lightoffice
          scripts/bootstrap.sh
          scripts/apply_overlay.sh

      # Preflight separately, as on macOS: a missing prerequisite that surfaces
      # two hours into a build costs a whole runner for an answer that was
      # available in seconds.
      - name: Preflight the Windows build
        if: steps.deps.outputs.qt == 'ok'
        shell: bash
        env:
          LIGHTOFFICE_SRC: /c/lightoffice/src
        run: scripts/build_windows.sh --check-only --arch x64

      - name: Build Windows (x64)
        if: steps.deps.outputs.qt == 'ok'
        continue-on-error: true
        shell: bash
        env:
          LIGHTOFFICE_SRC: /c/lightoffice/src
          LIGHTOFFICE_VERSION: 1.0.0.0
        run: scripts/build_windows.sh --arch x64

      # Say plainly whether an installer appeared. The step this replaces
      # reported SUCCESS while producing nothing, which is the failure mode
      # worth not repeating.
      - name: Report the Windows build outcome
        shell: bash
        run: |
          shopt -s nullglob
          found=(artifacts/WPS-Lite-win-*)
          {
            echo "### Windows build"
            echo
            if [ ${#found[@]} -gt 0 ]; then
              for f in "${found[@]}"; do
                printf -- '- produced `%s` (%s MiB)\n' "$f" "$(( $(stat -c%s "$f") / 1048576 ))"
              done
              echo
              echo "Unsigned: upstream's -Sign switch is opt-in and needs a certificate"
              echo "we do not have, so SmartScreen warns on first run."
            elif [ "${{ steps.deps.outputs.qt }}" != "ok" ]; then
              echo "**No Qt, so the build was skipped.** See the dependency step."
              echo "::warning::windows: skipped, no Qt on this runner"
            else
              echo "No installer produced. The build step is \`continue-on-error\`"
              echo "because this build is still being brought up -- read its log"
              echo "for the phase that stopped."
              echo "::notice::windows: build did not produce an installer yet"
            fi
          } | tee -a "$GITHUB_STEP_SUMMARY"

      # Guarded rather than deleted: when the native build above starts
      # producing artifacts/, this uploads them with no further change.
      #
      # The pattern is WPS-Lite-* and NOT artifacts/**. The first guard I wrote
      # used artifacts/** and did not work: artifacts/.gitkeep is tracked
      # (.gitignore keeps the directory with /artifacts/* plus
      # !/artifacts/.gitkeep), so after checkout the directory always contains
      # one file, hashFiles returned a hash, the condition was true, and the
      # step ran anyway — then upload-artifact skipped .gitkeep as a hidden file
      # and warned "No files were found" exactly as before. Observed in run
      # 34432524996. Matching the installer names instead tests for the thing we
      # actually mean, and cannot be satisfied by a placeholder file.
      - name: Upload Windows artifacts
        if: hashFiles('artifacts/WPS-Lite-*') != ''
        uses: actions/upload-artifact@v4
        with:
          name: windows-artifacts
          path: artifacts/
          retention-days: 30

  build-macos:
    name: Build macOS (${{ matrix.arch }})
    # Each architecture builds on a runner of its OWN architecture. No cross
    # compilation, which removes the problem that killed the previous approach:
    # Homebrew now refuses to install its x86_64 build on Apple Silicon
    # ("Homebrew on macOS is only supported on Apple Silicon processors!",
    # run 34606860124), so an Intel Qt could not be obtained there at all. On a
    # native Intel runner `brew install qt@5` is an ordinary install.
    #
    # THE RISK THIS TAKES ON, stated plainly because this repo has been bitten
    # by it: a runs-on label no runner answers does NOT fail fast, it QUEUES.
    # macos-13 did exactly that in run 34380149207 -- this job sat queued over
    # seven hours while the other two finished. That is worse than a failure:
    # the RUN never reaches a conclusion, so release.yml's
    # `gh run list --workflow build.yml --status success` can never find a run
    # to publish from. Job-level timeout-minutes does NOT help, because it
    # starts counting when the job starts RUNNING, not while it waits.
    #
    # So if the x86_64 leg sits queued while the arm64 leg makes progress, that
    # is this failure mode, and the response is to cancel the run rather than
    # wait it out. macos-15-intel is the current Intel label; macos-13 is the
    # retired one this comment used to warn about.
    #
    # fail-fast is off: these two architectures fail independently and the
    # verdict on one is not the verdict on the other.
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-latest
          - arch: x86_64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Cache Homebrew
        uses: actions/cache@v4
        with:
          path: /Users/runner/Library/Caches/Homebrew
          key: homebrew-${{ runner.os }}-${{ hashFiles('**/Brewfile') }}
          restore-keys: |
            homebrew-${{ runner.os }}-

      - name: Cache Xcode DerivedData
        uses: actions/cache@v4
        with:
          path: /Users/runner/Library/Developer/Xcode/DerivedData
          key: xcode-deriveddata-${{ runner.os }}-${{ matrix.arch }}-${{ hashFiles('**/*.xcodeproj/**', '**/*.xcworkspace/**', 'VERSION_LOCK') }}
          restore-keys: |
            xcode-deriveddata-${{ runner.os }}-${{ matrix.arch }}-

      # Same as the Windows job above: a placeholder that reported success while
      # producing nothing. See that comment for why this now speaks up.
      # STEP ONE OF THE macOS PORT: establish what only a real macOS runner can
      # tell us. The rest was already settled by inspecting the upstream repos
      # directly, and is recorded in scripts/package.sh:
      #
      #   - build_tools/tools/mac holds only 7za and toolchain.prf, so macOS
      #     needs none of the python3/Qt/sysroot staging tools/linux does.
      #   - the macOS build is NOT the qmake pipeline. It is
      #     desktop-apps/macos/ONLYOFFICE.xcodeproj driven by fastlane, lanes
      #     release_arm / release_x86_64 / release_v8.
      #   - the existing lane signs with a Developer ID and notarizes, which is
      #     exactly what fleet-only distribution does not need.
      #   - desktop-apps/macos/package_mac.py, which scripts/package.sh used to
      #     invoke, does not exist.
      #
      # What remains unknown is the runner itself: which Xcode, whether fastlane
      # and its Ruby deps are present, and whether Qt is available at all. Those
      # decide whether the lane can run here or needs its toolchain installed.
      - name: Discover what a macOS build needs
        continue-on-error: true
        shell: bash
        run: |
          set +e
          {
            echo "### macOS build: runner capabilities"
            echo
            echo '```'
            echo "macOS       : $(sw_vers -productVersion 2>/dev/null) ($(uname -m))"
            echo "Xcode       : $(xcodebuild -version 2>/dev/null | tr '\n' ' ')"
            echo "SDK         : $(xcrun --sdk macosx --show-sdk-version 2>/dev/null)"
            echo "clang       : $(clang --version 2>/dev/null | head -1)"
            echo "codesign    : $(command -v codesign || echo MISSING)"
            echo "hdiutil     : $(command -v hdiutil || echo MISSING)"
            echo "fastlane    : $(fastlane --version 2>/dev/null | tail -1 || echo 'not installed')"
            echo "ruby        : $(ruby --version 2>/dev/null || echo 'not installed')"
            echo "node/npx    : $(node --version 2>/dev/null) / $(command -v npx >/dev/null && echo yes || echo no)"
            echo "qmake       : $(command -v qmake6 qmake 2>/dev/null | head -1 || echo 'not installed')"
            echo "brew qt     : $(brew list --versions qt 2>/dev/null || echo 'not installed')"
            echo '```'
            echo
            echo "Ad-hoc signing is the target (fleet-only distribution, no Apple"
            echo "Developer account). Confirming codesign accepts the ad-hoc identity"
            echo "on this runner, which is the mechanism the whole plan rests on:"
            echo '```'
            printf 'int main(void){return 0;}\n' > /tmp/adhoc.c
            if clang -o /tmp/adhoc /tmp/adhoc.c 2>/dev/null; then
              codesign -s - --force /tmp/adhoc 2>&1 && echo "codesign -s - : OK"
              codesign -dv /tmp/adhoc 2>&1 | sed -n '1,6p'
            else
              echo "could not compile a test binary"
            fi
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
          exit 0

      # The real macOS build is a long pole: ONLYOFFICE.xcodeproj is only the
      # Cocoa shell and needs build_tools/out/mac_arm64 to exist first, which on
      # macOS means building the core from scratch every run — there is no
      # prebuilt-tree image on macOS the way there is on Linux.
      #
      # This proves the part that is unique to macOS and cheap to test: whether
      # ad-hoc signing yields something a fleet Mac will run, and whether the
      # .dmg step works once Ascensio's hardcoded Developer ID is out of the
      # picture. If either answers no, the core build would have been wasted.
      # Runner-level facts, identical for both matrix legs. Running it twice
      # proves nothing new and costs a minute.
      - name: Prove the macOS signing and packaging path
        if: matrix.arch == 'arm64'
        continue-on-error: true
        shell: bash
        run: |
          scripts/macos_packaging_spike.sh "$RUNNER_TEMP/spike" 2>&1 | tee "$RUNNER_TEMP/spike.log"
          {
            echo "### macOS signing and packaging spike"
            echo
            echo '```'
            cat "$RUNNER_TEMP/spike.log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit 0

      # THE REAL BUILD. Until now this job only echoed; the spike above settled
      # the signing and packaging questions, so what is left is producing
      # build_tools/out/mac_arm64 and linking the Xcode project against it.
      #
      # Everything about the ad-hoc path -- the xcodebuild overrides, why the
      # fastlane lane is bypassed, why appdmg.json's code-sign block is dropped
      # -- is documented in scripts/build_macos.sh rather than repeated here.
      #
      # Qt: the runners ship none (run 34560326333 reported `qmake: not
      # installed` and `brew qt: not installed`), so install it.
      #
      # build_macos.sh still checks Qt's architecture with lipo before building.
      # Native runners should make that check trivially true, which is the
      # point: it costs a second and it caught nothing only because the arch is
      # now right by construction. A wrong Qt would otherwise surface as every
      # Qt symbol undefined at the link -- how the ICU mismatch presented in run
      # 34595493731, 18 minutes in, looking like a missing dependency rather
      # than a wrong one.
      # Both legs now run natively, so this is the same ordinary Homebrew
      # install on each. The Rosetta dance that used to be here is gone with
      # the cross build: Homebrew refuses to install its x86_64 build on Apple
      # Silicon, which is what forced the move to a native Intel runner.
      #
      # qt@5 rather than qt@6: desktop-apps at the pinned revision builds
      # against Qt 5, the same as the Linux job's qtbase5-dev.
      - name: Install macOS build dependencies (${{ matrix.arch }})
        id: deps
        shell: bash
        run: |
          brew install qt@5 || brew install qt5 || true
          prefix="$(brew --prefix qt@5 2>/dev/null || true)"
          echo "runner arch: $(uname -m)   target: ${{ matrix.arch }}"
          echo "qt prefix: ${prefix:-NOT AVAILABLE}"
          # `[ -n "$x" ] && cmd` as the LAST line of a `bash -e` step exits 1
          # when the test is false, failing the step for a condition that is
          # not an error -- which is how an empty prefix became a red run in
          # 34606860124 instead of a reported finding. An if-block has no such
          # exit status.
          if [ -n "$prefix" ]; then
            # build_macos.sh prefers this over its own brew lookup.
            echo "LIGHTOFFICE_QT_PREFIX=$prefix" >> "$GITHUB_ENV"
            echo "qt=ok" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::macos ${{ matrix.arch }}: brew did not provide qt@5"
            echo "qt=missing" >> "$GITHUB_OUTPUT"
          fi

          # grunt drives the JS stage (sdkjs and web-apps). Upstream installs it
          # in build_tools/tools/linux/deps.py, which only runs on Linux -- and
          # even there fetch_prebuilts.sh skips deps.py, which is why
          # docker/build-linux.Dockerfile installs grunt-cli explicitly and says
          # so at length. macOS goes through neither path, so nothing provides
          # it: run 34669576598 compiled the whole native core in 35 minutes and
          # then died on `/bin/sh: grunt: command not found` (Error (grunt): 127).
          npm install -g grunt-cli >/dev/null 2>&1 || npm install -g grunt-cli
          # Presence, not `grunt --version`: that exits non-zero with no local
          # Gruntfile, the same trap the Dockerfile documents.
          if command -v grunt >/dev/null 2>&1; then
            echo "grunt: $(command -v grunt)"
          else
            echo "::warning::macos ${{ matrix.arch }}: grunt-cli did not install"
          fi
          echo "node: $(node --version 2>&1)   java: $(java -version 2>&1 | head -1)"

      # CMake 4 removed compatibility with pre-3.5 CMakeLists, and the runner
      # ships 4.4.3. Run 34575866221 got 22 minutes into make.py and died in
      # core's vendored x265 (pulled in by the heif module):
      #
      #   Policy CMP0025 may not be set to OLD behavior because this version of
      #   CMake no longer supports it.
      #   Compatibility with CMake < 3.5 has been removed from CMake.
      #
      # That is not our code and not upstream ONLYOFFICE's either -- it is a
      # third-party library pinned at a revision written for CMake 2.x, so it
      # cannot be fixed forward from here without forking it.
      #
      # CMake's own message suggests -DCMAKE_POLICY_VERSION_MINIMUM=3.5, but the
      # cmake invocations are inside upstream's python build driver, not ours to
      # add flags to; the environment variable of the same name would reach them
      # but only exists in CMake >= 4.0, so relying on it means relying on the
      # very version that broke this. Supplying a CMake that still supports
      # those policies needs no cooperation from either.
      #
      # 3.31.7 is the last 3.x. Homebrew keeps no old cmake formula, so take
      # Kitware's own macOS universal tarball and verify it: a build toolchain
      # fetched over the network without a checksum is an unpinned dependency,
      # which is the trap build_tools/depot_tools already sprang once here.
      - name: Pin CMake to the last 3.x (CMake 4 cannot build vendored x265)
        if: steps.deps.outputs.qt == 'ok'
        shell: bash
        run: |
          ver=3.31.7
          want=1cb11aa2edae8551bb0f22807c6f5246bd0eb60ae9fa1474781eb4095d299aca
          url="https://github.com/Kitware/CMake/releases/download/v$ver/cmake-$ver-macos-universal.tar.gz"
          curl -fsSL --retry 3 -o /tmp/cmake.tgz "$url"
          got=$(shasum -a 256 /tmp/cmake.tgz | cut -d' ' -f1)
          if [ "$got" != "$want" ]; then
            echo "::error::cmake tarball checksum mismatch: got $got, want $want"
            exit 1
          fi
          tar -xzf /tmp/cmake.tgz -C /tmp
          bin="/tmp/cmake-$ver-macos-universal/CMake.app/Contents/bin"
          [ -x "$bin/cmake" ] || { echo "::error::no cmake at $bin"; exit 1; }
          echo "$bin" >> "$GITHUB_PATH"
          echo "pinned: $("$bin/cmake" --version | head -1) (was $(cmake --version | head -1))"

      - name: Bootstrap the upstream tree
        if: steps.deps.outputs.qt == 'ok'
        shell: bash
        env:
          LIGHTOFFICE_SRC: /opt/lightoffice/src
        run: |
          sudo mkdir -p /opt/lightoffice
          sudo chown -R "$(id -u):$(id -g)" /opt/lightoffice
          scripts/bootstrap.sh
          scripts/apply_overlay.sh

      # Preflight first, as its own step. The build below takes hours, and a
      # missing prerequisite that surfaces two hours in costs a whole runner for
      # an answer that was available in ten seconds.
      - name: Preflight the macOS build (${{ matrix.arch }})
        if: steps.deps.outputs.qt == 'ok'
        shell: bash
        env:
          LIGHTOFFICE_SRC: /opt/lightoffice/src
        run: scripts/build_macos.sh --check-only --arch ${{ matrix.arch }}

      - name: Build macOS (${{ matrix.arch }}), ad-hoc signed
        if: steps.deps.outputs.qt == 'ok'
        id: macbuild
        continue-on-error: true
        shell: bash
        env:
          LIGHTOFFICE_SRC: /opt/lightoffice/src
        run: scripts/build_macos.sh --arch ${{ matrix.arch }}

      # This is a first attempt at a build nobody has run before. Say plainly
      # whether it produced an installer instead of letting a green checkmark
      # imply one: the placeholder this replaced reported success while
      # producing nothing, which is the failure mode worth not repeating.
      - name: Report the macOS build outcome
        shell: bash
        run: |
          shopt -s nullglob
          found=(artifacts/WPS-Lite-macos-*)
          {
            echo "### macOS build"
            echo
            if [ ${#found[@]} -gt 0 ]; then
              for f in "${found[@]}"; do
                printf -- '- produced `%s` (%s MiB)\n' "$f" "$(( $(stat -f%z "$f") / 1048576 ))"
              done
              echo
              echo "Ad-hoc signed; no Apple Developer account and no notarization."
            elif [ "${{ steps.deps.outputs.qt }}" != "ok" ]; then
              echo "**No ${{ matrix.arch }} Qt available, so the build was skipped.**"
              echo
              echo "\`brew install qt@5\` did not yield a Qt on this runner"
              echo "(\`${{ matrix.runner }}\`, $(uname -m)). Without Qt there is"
              echo "nothing to build against, so the build steps were skipped"
              echo "rather than run and fail later."
              echo "::warning::macos ${{ matrix.arch }}: skipped, no ${{ matrix.arch }} Qt on this runner"
            else
              echo "No installer produced. The build step is \`continue-on-error\`"
              echo "because this build is still being brought up -- read its log"
              echo "for the phase that stopped."
              echo "::notice::macos ${{ matrix.arch }}: build did not produce an installer yet"
            fi
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload macOS artifacts
        if: hashFiles('artifacts/WPS-Lite-*') != ''
        uses: actions/upload-artifact@v4
        with:
          name: macos-artifacts-${{ matrix.arch }}
          path: artifacts/
          retention-days: 30
