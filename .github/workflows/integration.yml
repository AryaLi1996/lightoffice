name: Integration

# Brings up the intranet collaboration stack and runs the criteria that can only
# be judged against live services: the co-authoring WebSocket (AC 3.3), two-way
# changeset delivery (AC 3.4) and file locking (AC 3.5).
#
# Not part of the PR gate — it pulls several GB of images and takes minutes —
# so it runs on demand, on pushes to main, and nightly.

on:
  push:
    branches: ["main"]
    paths:
      - "deploy/**"
      - "tests/**"
      - "scripts/test_filelock.sh"
      - ".github/workflows/integration.yml"
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  collaboration:
    name: Nextcloud + Document Server
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      DB_ROOT_PASSWORD: ci-root-${{ github.run_id }}
      DB_PASSWORD: ci-db-${{ github.run_id }}
      NEXTCLOUD_ADMIN_USER: ciadmin
      NEXTCLOUD_ADMIN_PASSWORD: ci-admin-${{ github.run_id }}
      DOCSERVER_JWT_SECRET: ci-jwt-${{ github.run_id }}
      ALICE_PASS: AlicePass!2345
      BOB_PASS: BobPass!2345

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Free disk space
        # The Document Server image alone is several GB; hosted runners ship
        # with large toolchain caches we do not need.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true
          df -h / | tail -1

      - name: Install dependencies
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Start the stack
        run: docker compose -f deploy/docker-compose.nextcloud.yml up -d

      - name: Wait for services to become healthy
        run: |
          wait_healthy() {
            local name="$1" tries="$2" i=0
            until [ "$(docker inspect -f '{{.State.Health.Status}}' "$name" 2>/dev/null)" = healthy ]; do
              i=$((i+1))
              if [ "$i" -ge "$tries" ]; then
                echo "::error::$name never became healthy"
                docker logs --tail 80 "$name" || true
                return 1
              fi
              sleep 5
            done
            echo "$name healthy after $((i*5))s"
          }
          wait_healthy lightoffice-db 60
          wait_healthy lightoffice-nextcloud 120
          wait_healthy lightoffice-documentserver 180

      - name: Verify AC 3.1 — status.php answers 200
        run: |
          code=$(curl -sS -o /dev/null -w '%{http_code}' -I http://localhost:8080/status.php)
          echo "status.php -> HTTP $code"
          curl -sS http://localhost:8080/status.php | jq .
          [ "$code" = "200" ]

      - name: Provision test users and enable transactional locking
        run: |
          occ() { docker exec -u www-data lightoffice-nextcloud php occ "$@"; }
          docker exec -u www-data -e OC_PASS="$ALICE_PASS" lightoffice-nextcloud \
            php occ user:add --password-from-env --display-name=Alice alice
          docker exec -u www-data -e OC_PASS="$BOB_PASS" lightoffice-nextcloud \
            php occ user:add --password-from-env --display-name=Bob bob
          occ config:system:set filelocking.enabled --type=boolean --value=true

      - name: Verify AC 3.5 — concurrent writers get 423 Locked
        run: scripts/test_filelock.sh --user alice --pass "$ALICE_PASS"

      - name: Serve co-editing fixtures
        run: |
          mkdir -p /tmp/served
          cp tests/fixtures/collab.docx tests/fixtures/editor.html /tmp/served/
          nohup node tests/fixture_server.js --port 8099 --dir /tmp/served > /tmp/fixture.log 2>&1 &
          for _ in $(seq 1 20); do
            curl -sf -o /dev/null http://10.0.7.1:8099/collab.docx && break
            sleep 1
          done
          docker exec lightoffice-documentserver \
            curl -sS -o /dev/null -w 'document server can fetch fixture -> %{http_code}\n' \
            http://10.0.7.1:8099/collab.docx

      - name: Verify AC 3.3 / 3.4 — two editors co-edit one document
        env:
          JWT_SECRET: ${{ env.DOCSERVER_JWT_SECRET }}
        run: |
          # Use whichever chromium Playwright installed for this runner.
          CHROME_PATH="$(node -e "console.log(require('playwright').chromium.executablePath())")"
          export CHROME_PATH
          node tests/coedit_browser.js --json baseline/coedit.json

      - name: Acceptance summary
        if: always()
        run: |
          scripts/verify_ac.sh --json ac_report.json | tee ac.log || true
          jq -r '.summary' ac_report.json >> "$GITHUB_STEP_SUMMARY" || true

      - name: Collect service logs on failure
        if: failure()
        run: |
          for c in lightoffice-nextcloud lightoffice-documentserver lightoffice-db; do
            echo "===== $c ====="
            docker logs --tail 200 "$c" 2>&1 || true
          done
          docker exec lightoffice-documentserver \
            tail -n 200 /var/log/onlyoffice/documentserver/docservice/out.log 2>&1 || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-evidence
          path: |
            baseline/coedit.json
            baseline/filelock.result
            ac_report.json
            ac.log
            /tmp/fixture.log

      - name: Tear down
        if: always()
        run: docker compose -f deploy/docker-compose.nextcloud.yml down -v
