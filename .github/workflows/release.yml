name: Release

# Builds LightOffice installers on each target OS and publishes them as a
# GitHub Release.
#
# This workflow is the answer to AC 5.1. Cross-platform packaging is host-bound
# and cannot be faked from one machine: .deb needs Linux and dpkg-deb, .exe
# needs Windows with MSVC and Inno Setup, .dmg needs macOS with Xcode and
# codesign. A matrix of hosted runners is the supported way to produce all
# three from one pipeline.
#
# Caveat worth knowing before running this: the ONLYOFFICE desktop build needs
# v8, which is fetched with depot_tools from chromium.googlesource.com. On a
# network where that host is blocked the build job stops there — run
# scripts/build_desktop.sh --check-only first to see the dependency state on
# your runners.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build (e.g. 1.0.0)"
        required: true
        default: "1.0.0"
      publish:
        description: "Publish a GitHub Release for the built artifacts"
        type: boolean
        default: false

permissions:
  contents: write

env:
  LIGHTOFFICE_VERSION: ${{ github.event.inputs.version || github.ref_name }}

jobs:
  preflight:
    name: Build preflight
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - id: v
        name: Resolve version
        run: |
          v="${LIGHTOFFICE_VERSION#v}"
          [ -n "$v" ] || { echo "::error::no version resolved"; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "building version $v"

      - name: Report dependency reachability
        # Informational: names exactly which upstream dependency would stop the
        # build on these runners, rather than letting it fail 40 minutes in.
        run: |
          for host in chromium.googlesource.com chrome-infra-packages.appspot.com github.com; do
            code=$(curl -s -o /dev/null -m 20 -w '%{http_code}' "https://$host/" || true)
            echo "$host -> HTTP ${code:-000}"
          done

  build:
    name: Build (${{ matrix.os }})
    needs: preflight
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            runner: ubuntu-latest
            artifact: WPS-Lite-linux-amd64.deb
          - os: windows
            runner: windows-latest
            artifact: WPS-Lite-win-x64.exe
          - os: macos
            runner: macos-latest
            artifact: WPS-Lite-mac-universal.dmg

    steps:
      - uses: actions/checkout@v4

      - name: Restore apt cache (Linux)
        if: matrix.os == 'linux'
        uses: actions/cache@v4
        id: apt-cache
        with:
          path: /var/cache/apt/archives
          key: apt-cache-${{ runner.os }}-${{ hashFiles('.github/workflows/release.yml') }}
          restore-keys: |
            apt-cache-${{ runner.os }}-

      - name: Restore prebuilt source cache (Linux)
        if: matrix.os == 'linux'
        uses: actions/cache@v4
        id: src-cache
        with:
          path: /opt/lightoffice/src
          key: lightoffice-src-${{ hashFiles('VERSION_LOCK', 'scripts/bootstrap.sh', 'scripts/fetch_prebuilts.sh', 'overlay/build/**') }}
          restore-keys: |
            lightoffice-src-

      - name: Monitor disk space before cleanup (Linux)
        if: matrix.os == 'linux'
        run: |
          echo "=== Disk usage before cleanup ==="
          df -h /
          free -h

      - name: Install Linux build dependencies
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            build-essential cmake p7zip-full autoconf libtool \
            qtbase5-dev qtbase5-private-dev qttools5-dev libqt5svg5-dev \
            qtmultimedia5-dev libqt5x11extras5-dev \
            libgtk-3-dev libglu1-mesa-dev libx11-xcb-dev libxi-dev \
            libxrender-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libnotify-dev libcups2-dev libdbus-1-dev libicu-dev \
            libasound2-dev libatspi2.0-dev dpkg-dev

      - name: Free disk space
        if: matrix.os == 'linux'
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true

      - name: Monitor disk space after cleanup (Linux)
        if: matrix.os == 'linux'
        run: |
          echo "=== Disk usage after cleanup ==="
          df -h /
          available=$(df / | awk 'NR==2 {print $4}')
          available_gb=$((available / 1024 / 1024))
          if [ "$available_gb" -lt 10 ]; then
            echo "::warning::Only ${available_gb}GB available — build may fail"
          fi

      - name: Log cache status
        if: matrix.os == 'linux'
        run: |
          if [ "${{ steps.src-cache.outputs.cache-hit }}" = "true" ]; then
            echo "✅ Source cache HIT - skipping Docker image pull"
          else
            echo "❌ Source cache MISS - will restore from Docker image or build from scratch"
          fi

      # ninja and make both key off absolute paths and mtimes, so the tree is
      # restored to the SAME path the image built it at (/opt/lightoffice/src).
      # Restoring elsewhere would rebuild everything and buy nothing.
      #
      # Best-effort by design: if no image has been published yet, or the pull
      # fails, the build falls through to a full from-source build exactly as
      # before. A missing cache must never be a broken pipeline.
      - id: prebuilt
        name: Restore prebuilt dependencies from the build image
        if: matrix.os == 'linux' && steps.src-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          repo="$(echo "ghcr.io/${{ github.repository }}-build" | tr '[:upper:]' '[:lower:]')"
          tag="$(grep '^UPSTREAM_TAG=' VERSION_LOCK | cut -d= -f2)"
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin || true
          if ! docker pull "$repo:$tag"; then
            echo "::notice::no prebuilt image at $repo:$tag — building everything from source"
            echo "hit=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          docker run --rm "$repo:$tag" cat /etc/lightoffice-build-image || true

          # Disk is the leading suspect for a truncated restore: the runner
          # holds the pulled layers AND a second full copy of the tree, and a
          # copy that dies on ENOSPC part way through leaves a plausible-looking
          # but incomplete tree. Record it either side so a future failure is
          # answerable from the log instead of guessed at.
          echo "disk before copy:"; df -h / | tail -1
          sudo mkdir -p /opt/lightoffice
          cid="$(docker create "$repo:$tag")"
          sudo docker cp "$cid:/opt/lightoffice/src" /opt/lightoffice/src
          docker rm "$cid" >/dev/null
          echo "disk after copy:"; df -h / | tail -1
          sudo chown -R "$(id -u):$(id -g)" /opt/lightoffice
          docker rmi "$repo:$tag" >/dev/null 2>&1 || true
          echo "restored $(du -sh /opt/lightoffice/src | cut -f1) to /opt/lightoffice/src"

          # Trust the image only as far as it can be checked. A restore that
          # looks fine but is missing a path the build needs costs the whole
          # build step before it says so: an image missing sdkjs/build/build.py
          # got 23 minutes of restore and then 25 minutes of build before
          # dying. Discard an incomplete tree and let bootstrap.sh do a clean
          # clone instead — slower than a good image, far faster than failing.
          incomplete=""
          # sdkjs/build/build.py is what build_tools runs, and it exists only
          # after bootstrap.sh's sdkjs override. See docker/build-linux.Dockerfile.
          for p in sdkjs/build/build.py web-apps/build/Gruntfile.js core/Common \
                   desktop-sdk desktop-apps/win-linux build_tools .git \
                   core-fonts/ASC.ttf document-templates/new; do
            [ -e "/opt/lightoffice/src/$p" ] || incomplete="$incomplete $p"
          done
          if [ -n "$incomplete" ]; then
            echo "::warning::prebuilt tree is incomplete (missing:$incomplete) — discarding it and building from source"
            sudo rm -rf /opt/lightoffice/src
            echo "hit=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "prebuilt tree has every path the build needs"
          echo "hit=true" >> "$GITHUB_OUTPUT"

      - name: Bootstrap upstream sources
        shell: bash
        env:
          LIGHTOFFICE_SRC: ${{ matrix.os == 'linux' && '/opt/lightoffice/src' || format('{0}/onlyoffice-src', runner.temp) }}
        run: scripts/bootstrap.sh "$LIGHTOFFICE_SRC"

      - name: Fetch prebuilt CEF and bootstrap Python
        shell: bash
        env:
          LIGHTOFFICE_SRC: ${{ matrix.os == 'linux' && '/opt/lightoffice/src' || format('{0}/onlyoffice-src', runner.temp) }}
        run: scripts/fetch_prebuilts.sh || echo "::warning::prebuilt fetch incomplete; the build may not start"

      - name: Apply the LightOffice overlay
        shell: bash
        env:
          LIGHTOFFICE_SRC: ${{ matrix.os == 'linux' && '/opt/lightoffice/src' || format('{0}/onlyoffice-src', runner.temp) }}
        run: |
          scripts/apply_overlay.sh "$LIGHTOFFICE_SRC"
          scripts/apply_build_flags.sh "$LIGHTOFFICE_SRC"
          scripts/patch_qt_compat.sh "$LIGHTOFFICE_SRC"
          scripts/patch_v8_incremental.sh "$LIGHTOFFICE_SRC"
          scripts/trim_dictionaries.sh "$LIGHTOFFICE_SRC"

      # Roughly 55 of the desktop build's 61 minutes rebuild pinned dependencies
      # (boost, cef, icu, openssl, v8's 2929 targets, core/) that never change
      # between runs; only the last few minutes compile desktop-apps. Without
      # this step a missing include there is discovered an hour in, and only the
      # first one, because make stops at it. This compiles the same sources with
      # -fsyntax-only in about a minute and reports all of them.
      - name: Check desktop-apps compiles against this Qt
        if: matrix.os == 'linux'
        shell: bash
        env:
          LIGHTOFFICE_SRC: ${{ matrix.os == 'linux' && '/opt/lightoffice/src' || format('{0}/onlyoffice-src', runner.temp) }}
        run: scripts/check_qt_compat.sh

      # Compiling is Linux-only, so the preflight runs only there. Letting it
      # run everywhere made build_desktop.sh's platform guard exit 2 on macOS
      # and Windows, and continue-on-error turns that into a green job carrying
      # a red "Process completed with exit code 2" annotation. A workflow that
      # prints an error on every run for expected behaviour teaches people to
      # ignore its errors, so the host limitation is expressed with an `if`
      # rather than a non-zero exit.
      - name: Build preflight
        id: pre
        if: matrix.os == 'linux'
        shell: bash
        continue-on-error: true
        env:
          LIGHTOFFICE_SRC: ${{ matrix.os == 'linux' && '/opt/lightoffice/src' || format('{0}/onlyoffice-src', runner.temp) }}
        run: scripts/build_desktop.sh --check-only

      - name: Build the desktop editors
        if: matrix.os == 'linux' && steps.pre.outcome == 'success'
        shell: bash
        env:
          LIGHTOFFICE_SRC: ${{ matrix.os == 'linux' && '/opt/lightoffice/src' || format('{0}/onlyoffice-src', runner.temp) }}
        run: scripts/build_desktop.sh

      - name: Package
        if: matrix.os == 'linux' && steps.pre.outcome == 'success'
        shell: bash
        env:
          LIGHTOFFICE_SRC: ${{ matrix.os == 'linux' && '/opt/lightoffice/src' || format('{0}/onlyoffice-src', runner.temp) }}
        run: scripts/package.sh --version "${{ needs.preflight.outputs.version }}"

      # A build that ran and then produced nothing is a green check that means
      # nothing. Only assert this where a build was actually attempted.
      - name: Verify the build produced an installer
        if: matrix.os == 'linux' && steps.pre.outcome == 'success'
        shell: bash
        run: |
          shopt -s nullglob
          found=(artifacts/WPS-Lite-*)
          if [ ${#found[@]} -eq 0 ]; then
            echo "::error::the build and packaging steps succeeded but produced no installer in artifacts/"
            exit 1
          fi
          printf 'produced: %s\n' "${found[@]}"

      - name: Emergency disk cleanup (Linux)
        if: matrix.os == 'linux' && always()
        shell: bash
        run: |
          if [ -d "/opt/lightoffice/src" ]; then
            size_before=$(du -sh /opt/lightoffice/src | cut -f1)
            find /opt/lightoffice/src -type f -name '*.o' -delete 2>/dev/null || true
            find /opt/lightoffice/src -type f -name '.ninja_log' -delete 2>/dev/null || true
            find /opt/lightoffice/src -type f -name '.ninja_deps' -delete 2>/dev/null || true
            size_after=$(du -sh /opt/lightoffice/src | cut -f1)
            echo "Intermediate cleanup: ${size_before} → ${size_after}"
          fi

      - name: Report a skipped build
        if: matrix.os != 'linux' || steps.pre.outcome != 'success'
        shell: bash
        run: |
          if [ "${{ matrix.os }}" != "linux" ]; then
            # Not a failure and not a missing dependency: there is no native
            # recipe wired up for this host yet. Say which one it would need,
            # so the gap is actionable rather than mysterious.
            case "${{ matrix.os }}" in
              macos)   needs="desktop-apps/macos (Xcode + codesign)" ;;
              windows) needs="desktop-apps/win-linux/package/windows (MSVC + Inno Setup)" ;;
              *)       needs="a native build recipe" ;;
            esac
            echo "::notice::${{ matrix.os }}: no installer — scripts/build_desktop.sh drives the Linux pipeline only"
            {
              echo "### ${{ matrix.os }}: no installer produced"
              echo
              echo "This is a known gap, not a failure. \`scripts/build_desktop.sh\` drives"
              echo "the Linux pipeline (\`build_tools/tools/linux\`); producing a native"
              echo "package here needs $needs."
              echo
              echo "The bootstrap, prebuilt-fetch and overlay steps DID run on this host,"
              echo "so they still cover the overlay scripts cross-platform."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::linux build skipped — preflight reported unmet dependencies"
            {
              echo "### linux: build skipped"
              echo "Preflight found unmet dependencies. See the 'Build preflight' step."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/upload-artifact@v4
        # Only the Linux job can produce installers, and the step above already
        # fails loudly if it built without producing one. Uploading from every
        # host just to warn "no files found" is noise on a job that was never
        # going to have any.
        if: matrix.os == 'linux'
        with:
          name: installer-${{ matrix.os }}
          path: artifacts/*
          if-no-files-found: warn

  publish:
    name: Publish release
    needs: [preflight, build]
    if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: installer-*
          merge-multiple: true

      - name: Verify AC 5.1 — all three installers, none of them a stub
        id: check
        run: |
          shopt -s nullglob
          cd dist
          missing=0
          for f in WPS-Lite-linux-amd64.deb WPS-Lite-win-x64.exe WPS-Lite-mac-universal.dmg; do
            if [ -f "$f" ]; then
              size=$(stat -c%s "$f")
              mb=$((size / 1024 / 1024))
              if [ "$mb" -lt 50 ]; then
                echo "::error::$f is only ${mb}MB — under the 50MB floor, likely a broken package"
                missing=1
              else
                echo "$f: ${mb}MB"
              fi
            else
              echo "::warning::$f was not produced"
              missing=1
            fi
          done
          sha256sum WPS-Lite-* > checksums.txt 2>/dev/null || true
          cat checksums.txt || true
          echo "complete=$([ "$missing" -eq 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Create the GitHub Release
        # gh is preinstalled on hosted runners, so this avoids pulling in a
        # third-party action for a two-line job.
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.preflight.outputs.version }}
          COMPLETE: ${{ steps.check.outputs.complete }}
        run: |
          cd dist
          {
            echo "LightOffice v$VERSION"
            echo
            if [ "$COMPLETE" != "true" ]; then
              echo "**Incomplete release** - not every platform installer was produced."
              echo "See the build job logs for which host failed preflight and why."
              echo
            fi
            echo '```'
            cat checksums.txt 2>/dev/null || echo "(no checksums)"
            echo '```'
          } > notes.md

          prerelease=""
          [ "$COMPLETE" = "true" ] || prerelease="--prerelease"

          if gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "v$VERSION" WPS-Lite-* checksums.txt \
              --clobber --repo "$GITHUB_REPOSITORY"
          else
            # shellcheck disable=SC2086  # prerelease is an intentional word split
            gh release create "v$VERSION" \
              --repo "$GITHUB_REPOSITORY" \
              --title "LightOffice v$VERSION" \
              --notes-file notes.md \
              $prerelease \
              WPS-Lite-* checksums.txt
          fi
