name: release

# This workflow publishes prebuilt artifacts generated by the separate build
# workflow. It does not build installers itself.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (e.g. 1.0.0)"
        required: true
        default: "1.0.0"
      publish:
        description: "Publish a GitHub Release for the built artifacts"
        type: boolean
        default: false
      build_run_id:
        description: "Build Artifacts run to publish from (default: newest successful)"
        required: false
        default: ""

permissions:
  contents: write
  actions: read

env:
  LIGHTOFFICE_VERSION: ${{ github.event.inputs.version || github.ref_name }}

jobs:
  preflight:
    name: Build preflight
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - id: v
        name: Resolve version
        run: |
          v="${LIGHTOFFICE_VERSION#v}"
          [ -n "$v" ] || { echo "::error::no version resolved"; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "publishing version $v"

  publish:
    name: Publish release
    needs: preflight
    if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # actions/download-artifact only sees artifacts from its OWN run unless it
      # is given a run-id and a token. The installers are produced by build.yml,
      # a different workflow and therefore a different run, so without this the
      # download silently yields nothing and the release publishes an empty
      # directory. Resolve the newest successful build.yml run on this ref and
      # pull from that.
      - id: src
        name: Find the build run to publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_id="${{ github.event.inputs.build_run_id }}"
          if [ -z "$run_id" ]; then
            run_id=$(gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow build.yml \
              --status success \
              --limit 1 \
              --json databaseId --jq '.[0].databaseId')
          fi
          if [ -z "$run_id" ] || [ "$run_id" = "null" ]; then
            echo "::error::no successful build.yml run to publish from — run Build Artifacts first"
            exit 1
          fi
          echo "publishing artifacts from build.yml run $run_id"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: '*-artifacts'
          merge-multiple: true
          run-id: ${{ steps.src.outputs.run_id }}
          github-token: ${{ github.token }}

      - name: Verify installers
        id: check
        run: |
          shopt -s nullglob
          cd dist
          missing=0
          for f in WPS-Lite-linux-amd64.deb WPS-Lite-win-x64.exe WPS-Lite-mac-universal.dmg; do
            if [ -f "$f" ]; then
              size=$(stat -c%s "$f")
              mb=$((size / 1024 / 1024))
              if [ "$mb" -lt 50 ]; then
                echo "::error::$f is only ${mb}MB — under the 50MB floor, likely a broken package"
                missing=1
              else
                echo "$f: ${mb}MB"
              fi
            else
              echo "::warning::$f was not produced"
              missing=1
            fi
          done
          sha256sum WPS-Lite-* > checksums.txt 2>/dev/null || true
          cat checksums.txt || true
          echo "complete=$([ "$missing" -eq 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.preflight.outputs.version }}
          COMPLETE: ${{ steps.check.outputs.complete }}
        run: |
          cd dist
          {
            echo "LightOffice v$VERSION"
            echo
            if [ "$COMPLETE" != "true" ]; then
              echo "**Incomplete release** - not every platform installer was produced."
              echo "See the build workflow logs for which host failed preflight and why."
              echo
            fi
            echo '```'
            cat checksums.txt 2>/dev/null || echo "(no checksums)"
            echo '```'
          } > notes.md

          prerelease=""
          [ "$COMPLETE" = "true" ] || prerelease="--prerelease"

          if gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "v$VERSION" WPS-Lite-* checksums.txt \
              --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "v$VERSION" \
              --repo "$GITHUB_REPOSITORY" \
              --title "LightOffice v$VERSION" \
              --notes-file notes.md \
              $prerelease \
              WPS-Lite-* checksums.txt
          fi
