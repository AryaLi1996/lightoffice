# LightOffice intranet collaboration stack.
#
# Two address spaces, and keeping them apart matters:
#
# Credentials are ${VAR:?...} rather than ${VAR:-default}: a default that works
# is a default that ships. Compose refuses to start until deploy/.env exists —
# scripts/gen_env.sh generates one with random secrets.
#
#   LIGHTOFFICE_PUBLIC_HOST  the address CLIENTS use. In production this is the
#                            host's own address on the corporate network — the
#                            EC2 private IP from deploy/aws/lightoffice-stack.yaml
#                            (10.0.7.10 by default). It is compiled into the
#                            desktop client, so it must be decided before the
#                            client is built.
#   172.28.7.0/24            the bridge the containers talk to EACH OTHER on.
#                            Purely internal, never reachable by a client, and
#                            deliberately NOT in 10.0.7.0/24: on the AWS host
#                            that range belongs to the VPC subnet, and a docker
#                            bridge overlapping it would blackhole the host's
#                            own traffic.
#
# Clients reach the stack over TLS only: :443 for the portal and :8443 for the
# Document Server, both terminated by the nginx proxy. The backends publish no
# host ports at all — previously everything, including WebDAV Basic-auth
# credentials and document contents, crossed the network as plain HTTP.

services:
  db:
    image: mariadb:10.11
    container_name: lightoffice-db
    command: --transaction-isolation=READ-COMMITTED --log-bin=binlog --binlog-format=ROW
    restart: unless-stopped
    volumes:
      - db_data:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD is required - run scripts/gen_env.sh}
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required - run scripts/gen_env.sh}
      MYSQL_DATABASE: nextcloud
      MYSQL_USER: nextcloud
    networks:
      intranet:
        ipv4_address: 172.28.7.30
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 20

  nextcloud:
    image: nextcloud:29-apache
    container_name: lightoffice-nextcloud
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - nextcloud_data:/var/www/html
    environment:
      # Service name, not the bridge IP: docker's embedded DNS resolves it, so
      # the stack survives a change of bridge subnet. Nextcloud persists this
      # value into config.php at install time, so a hardcoded IP here becomes a
      # permanent, silent dependency on that exact subnet.
      MYSQL_HOST: db
      MYSQL_DATABASE: nextcloud
      MYSQL_USER: nextcloud
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required - run scripts/gen_env.sh}
      NEXTCLOUD_ADMIN_USER: ${NEXTCLOUD_ADMIN_USER:-admin}
      NEXTCLOUD_ADMIN_PASSWORD: ${NEXTCLOUD_ADMIN_PASSWORD:?NEXTCLOUD_ADMIN_PASSWORD is required - run scripts/gen_env.sh}
      # Both the intranet address and the host-published address must be trusted,
      # otherwise Nextcloud answers requests with "untrusted domain".
      # Nextcloud refuses requests whose Host header is not trusted, so the
      # client-facing address has to be listed here as well as compiled into
      # the client. Override LIGHTOFFICE_PUBLIC_HOST in deploy/.env to point a
      # deployment somewhere else.
      NEXTCLOUD_TRUSTED_DOMAINS: >-
        ${LIGHTOFFICE_PUBLIC_HOST:-10.0.7.10}
        localhost 127.0.0.1
      OVERWRITEHOST: "${LIGHTOFFICE_PUBLIC_HOST:-10.0.7.10}"
      OVERWRITEPROTOCOL: "https"
      # Without this Nextcloud ignores X-Forwarded-Proto and keeps emitting
      # http:// URLs, which browsers then block as mixed content.
      TRUSTED_PROXIES: "172.28.7.0/24"
    networks:
      intranet:
        ipv4_address: 172.28.7.10
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost/status.php"]
      interval: 10s
      timeout: 5s
      retries: 30

  documentserver:
    # Pinned: :latest silently changes the co-editing engine under a deployment
    # whose clients were built and tested against a specific version.
    image: onlyoffice/documentserver:9.4.0
    container_name: lightoffice-documentserver
    restart: unless-stopped
    environment:
      # Document Server refuses to fetch documents from RFC1918 addresses
      # unless this is set (default.json ships allowPrivateIPAddress: false).
      # An intranet deployment has no alternative: Nextcloud only ever has a
      # private address. Without it every document fails to open with the
      # unhelpful "Download failed" and nothing in the editor names the cause.
      #
      # The corresponding risk — SSRF to internal services — is contained by
      # the JWT below, which means only a party holding the secret can ask the
      # server to fetch a URL at all.
      ALLOW_PRIVATE_IP_ADDRESS: "true"
      JWT_ENABLED: "true"
      JWT_SECRET: ${DOCSERVER_JWT_SECRET:?DOCSERVER_JWT_SECRET is required - run scripts/gen_env.sh}
      JWT_HEADER: "Authorization"
    volumes:
      - ds_data:/var/www/onlyoffice/Data
      - ds_logs:/var/log/onlyoffice
    networks:
      intranet:
        ipv4_address: 172.28.7.20
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost/healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 40

  proxy:
    image: nginx:1.27-alpine
    container_name: lightoffice-proxy
    restart: unless-stopped
    depends_on:
      nextcloud:
        condition: service_healthy
      documentserver:
        condition: service_healthy
    ports:
      - "443:443"     # portal / WebDAV
      - "8443:8443"   # document server (editor assets + co-authoring socket)
    volumes:
      - ./nginx/lightoffice.conf:/etc/nginx/conf.d/default.conf:ro
      - ./tls:/etc/nginx/tls:ro
    networks:
      intranet:
        ipv4_address: 172.28.7.40
    healthcheck:
      test: ["CMD", "wget", "-qO-", "--no-check-certificate", "https://localhost/status.php"]
      interval: 15s
      timeout: 5s
      retries: 20

volumes:
  db_data:
  nextcloud_data:
  ds_data:
  ds_logs:

networks:
  intranet:
    name: lightoffice-intranet
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.7.0/24
          gateway: 172.28.7.1
