# TLS termination for the LightOffice collaboration stack.
#
# Two server blocks, one per backend, because ONLYOFFICE Document Server
# expects to own its origin — serving it under a path prefix of the Nextcloud
# origin breaks its asset and WebSocket URLs.
#
#   :443   -> nextcloud       (portal, WebDAV)
#   :8443  -> documentserver  (editor assets, co-authoring WebSocket)

upstream nextcloud     { server nextcloud:80; }
upstream documentserver { server documentserver:80; }

# Co-editing runs over a WebSocket, which only survives the proxy if the
# Upgrade/Connection pair is forwarded. Without this map the socket is
# downgraded to a plain request and co-authoring silently never starts.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

ssl_protocols TLSv1.2 TLSv1.3;
ssl_prefer_server_ciphers off;
ssl_session_cache shared:LightOffice:10m;
ssl_session_timeout 1d;

# Container health only. The Docker healthcheck hits this and nothing else;
# it is bound to the loopback literal and is not published in the compose file.
#
# This replaces `wget -qO- --no-check-certificate https://localhost/status.php`,
# which shipped with the proxy in e9d8ee4 and has never once reported healthy --
# Integration has failed on it every run since. Two things were wrong with it,
# and this endpoint depends on neither:
#
#   * IPv6. The nginx entrypoint normally adds `listen [::]:443` by rewriting
#     this file, but we mount it read-only, so the container logs
#       10-listen-on-ipv6-by-default.sh: info: can not modify
#         /etc/nginx/conf.d/default.conf (read-only file system?)
#     and nginx stays IPv4-only -- while `localhost` resolves ::1 first from
#     Docker's stock /etc/hosts. curl falls back to 127.0.0.1; BusyBox wget,
#     which is all an alpine image has, does not reliably.
#
#   * Scope. It made the proxy's health depend on TLS in BusyBox wget AND on
#     Nextcloud answering /status.php -- when Nextcloud already has its own
#     healthcheck, and compose already gates the proxy on it. A container
#     healthcheck should say whether THIS container serves.
#
# Plain HTTP, explicit 127.0.0.1, served by nginx itself.
server {
    listen 127.0.0.1:8080;
    server_name _;
    access_log off;

    location = /healthz { return 200 "ok\n"; }
    location /          { return 404; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;

    # Documents, not web pages: the default 1m would reject most real uploads.
    client_max_body_size 0;
    client_body_timeout 300s;

    add_header Strict-Transport-Security "max-age=15768000" always;

    location / {
        proxy_pass http://nextcloud;
        proxy_http_version 1.1;
        # $http_host, not $host: $host drops the port, and Document Server
        # builds its own download URLs from this header. With $host it emits
        # https://<host>/cache/... on the default port, which lands on the
        # Nextcloud listener instead of itself and fails as "Download failed".
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # Nextcloud generates its own URLs from this; without it every link it
        # emits would be http:// and browsers would block them as mixed content.
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_read_timeout 300s;
        proxy_buffering off;
    }
}

server {
    listen 8443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;

    client_max_body_size 0;

    location / {
        proxy_pass http://documentserver;
        proxy_http_version 1.1;
        # $http_host, not $host: $host drops the port, and Document Server
        # builds its own download URLs from this header. With $host it emits
        # https://<host>/cache/... on the default port, which lands on the
        # Nextcloud listener instead of itself and fails as "Download failed".
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_read_timeout 3600s;   # co-authoring sockets are long-lived
        proxy_buffering off;
    }
}
