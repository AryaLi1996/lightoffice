<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>LightOffice co-edit fixture</title>
  <style>html,body{margin:0;height:100%}#ph{height:100%}</style>
</head>
<body>
  <div id="ph"></div>
  <script>
    // Every address is supplied by the caller rather than hardcoded. The
    // Document Server has to be loaded from an address the BROWSER can reach —
    // its published host port, never a container bridge IP, which resolves
    // only inside the docker host.
    (function () {
      var p = new URLSearchParams(location.search);
      var docserver = p.get('docserver');
      var fixtures = p.get('fixtures');
      if (!docserver || !fixtures) {
        document.body.textContent = 'missing ?docserver= and ?fixtures= parameters';
        return;
      }
      window.__events = [];
      var s = document.createElement('script');
      s.src = docserver + '/web-apps/apps/api/documents/api.js';
      s.onerror = function () {
        window.__events.push('onError:{"apiLoad":"failed","src":"' + s.src + '"}');
      };
      s.onload = function () {
        window.__editor = new DocsAPI.DocEditor('ph', {
          document: {
            fileType: 'docx',
            key: p.get('key'),
            title: 'collab.docx',
            url: fixtures + '/collab.docx',
            permissions: { edit: true, download: true }
          },
          documentType: 'word',
          editorConfig: {
            mode: 'edit',
            lang: 'en',
            callbackUrl: fixtures + '/callback',
            user: { id: p.get('uid'), name: p.get('uname') },
            customization: { autosave: true, forcesave: false }
          },
          token: p.get('token'),
          width: '100%',
          height: '100%',
          events: {
            onAppReady: function () { window.__events.push('onAppReady'); },
            onDocumentReady: function () { window.__events.push('onDocumentReady'); },
            onError: function (e) { window.__events.push('onError:' + JSON.stringify(e && e.data)); },
            onWarning: function (e) { window.__events.push('onWarning:' + JSON.stringify(e && e.data)); }
          }
        });
      };
      document.head.appendChild(s);
    })();
  </script>
</body>
</html>
